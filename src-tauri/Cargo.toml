[package]
name = "kapatma-zamanlayici"
version = "0.1.0"
description = "Zamanlanmış kapatma, yeniden başlatma ve oturum kapatma uygulaması"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kapatma-zamanlayici"
path = "src/main.rs"
